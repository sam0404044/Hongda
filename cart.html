<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>購物車 | 宏達升學教育機構</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { colors: { primary: { DEFAULT: '#1a5f4a', light: '#2d8a6e' } } } } }</script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="min-h-screen flex flex-col">
  <header class="sticky top-0 z-50 border-b bg-white">
    <div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-4">
      <a href="index.html" class="text-xl font-bold text-primary">宏達升學教育機構</a>
      <nav class="hidden md:flex items-center gap-6">
        <a href="courses.html" class="text-gray-600 hover:text-primary">課程列表</a>
        <a href="cart.html" class="text-primary font-medium">購物車</a>
        <a href="login.html" class="btn-primary">會員登入</a>
      </nav>
    </div>
  </header>

  <main class="mx-auto max-w-4xl flex-1 px-4 py-8">
    <h1 class="section-title mb-6">購物車</h1>
    <div id="cart-empty" class="rounded-xl border bg-gray-50 p-12 text-center hidden">
      <p class="text-gray-600">購物車是空的</p>
      <a href="courses.html" class="btn-primary mt-4 inline-block">去選課</a>
    </div>
    <div id="cart-list" class="space-y-4 hidden">
      <!-- 由 JS 或手動維護 -->
    </div>
    <div id="cart-summary" class="mt-6 rounded-xl border bg-gray-50 p-4 hidden">
      <p class="text-lg font-medium">付款方式：請於結帳頁選擇（綠界 / 其他）</p>
      <p class="mt-2 text-sm text-gray-600">未登入將導向會員登入後再結帳。</p>
      <p class="mt-4 text-xl font-bold">總計：NT$ <span id="cart-total">0</span></p>
      <a href="checkout.html" class="btn-primary mt-4 block text-center">前往結帳</a>
    </div>
  </main>

  <footer class="border-t bg-gray-50 py-8">
    <div class="mx-auto max-w-7xl px-4 text-sm text-gray-500">
      <p>宏達補習班 · 臺南市中西區中正路88號7樓 · 電話：(06) 2201833</p>
    </div>
  </footer>
  <script src="js/main.js"></script>
  <script>
    (function () {
      var add = new URLSearchParams(location.search).get('add');
      if (add) {
        try {
          var cart = localStorage.getItem('cart');
          var arr = cart ? JSON.parse(cart) : [];
          if (arr.indexOf(add) === -1) arr.push(add);
          localStorage.setItem('cart', JSON.stringify(arr));
          history.replaceState({}, '', 'cart.html');
        } catch (e) {}
      }
      var cart = [];
      try { cart = JSON.parse(localStorage.getItem('cart') || '[]'); } catch (e) {}
      var courses = [
        { id: '1', title: '日文發音入門', price: 1280, cover: 'https://images.unsplash.com/photo-1528360983277-13d401cdc186?w=400&h=225&fit=crop' },
        { id: '2', title: '初級日語會話', price: 1980, cover: 'https://images.unsplash.com/photo-1528164344705-47542687000d?w=400&h=225&fit=crop' },
        { id: '3', title: '中級閱讀與寫作', price: 2580, cover: 'https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?w=400&h=225&fit=crop' },
        { id: '4', title: '商務日語', price: 3200, cover: 'https://images.unsplash.com/photo-1454165804606-c3d57bc86b40?w=400&h=225&fit=crop' }
      ];
      var items = cart.map(function(id) { return courses.find(function(c) { return c.id === id; }); }).filter(Boolean);
      var total = items.reduce(function(s, c) { return s + c.price; }, 0);
      var emptyEl = document.getElementById('cart-empty');
      var listEl = document.getElementById('cart-list');
      var summaryEl = document.getElementById('cart-summary');
      var totalEl = document.getElementById('cart-total');
      if (items.length === 0) {
        emptyEl.classList.remove('hidden');
      } else {
        listEl.classList.remove('hidden');
        summaryEl.classList.remove('hidden');
        totalEl.textContent = total;
        listEl.innerHTML = items.map(function(c) {
          return '<div class="flex gap-4 rounded-xl border bg-white p-4">' +
            '<img src="' + c.cover + '" alt="" class="h-24 w-40 flex-shrink-0 rounded object-cover" />' +
            '<div class="flex-1"><h2 class="font-medium">' + c.title + '</h2><p class="text-primary">NT$ ' + c.price + '</p></div>' +
            '<button type="button" class="cart-remove text-red-600 hover:underline" data-id="' + c.id + '">移除</button></div>';
        }).join('');
        listEl.querySelectorAll('.cart-remove').forEach(function(btn) {
          btn.addEventListener('click', function() {
            var id = btn.getAttribute('data-id');
            var arr = cart.filter(function(i) { return i !== id; });
            localStorage.setItem('cart', JSON.stringify(arr));
            location.reload();
          });
        });
      }
    })();
  </script>
</body>
</html>

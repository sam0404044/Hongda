<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>付款結果 | 宏達升學教育機構</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { colors: { primary: { DEFAULT: '#1a5f4a', light: '#2d8a6e' } } } } }</script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="min-h-screen flex flex-col">
  <header class="sticky top-0 z-50 border-b bg-white">
    <div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-4">
      <a href="index.html" class="text-xl font-bold text-primary">宏達升學教育機構</a>
      <nav class="hidden md:flex items-center gap-6">
        <a href="account.html" class="text-gray-600 hover:text-primary">會員中心</a>
        <a href="login.html" class="btn-primary">會員登入</a>
      </nav>
    </div>
  </header>

  <main class="mx-auto max-w-lg flex-1 px-4 py-12">
    <div id="result-success" class="rounded-xl border bg-white p-8 text-center hidden">
      <p class="mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-green-100 text-4xl text-green-500">✓</p>
      <h1 class="mt-4 text-xl font-bold">付款成功</h1>
      <p class="mt-2 text-gray-600">權限已開通，您現在可以觀看課程。</p>
      <div class="mt-6 flex flex-col gap-2 sm:flex-row sm:justify-center">
        <a href="account-courses.html" class="btn-primary">我的課程</a>
        <a href="courses.html" class="btn-outline">繼續選課</a>
      </div>
    </div>
    <div id="result-fail" class="rounded-xl border bg-white p-8 text-center hidden">
      <p class="mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-red-100 text-4xl text-red-500">✕</p>
      <h1 class="mt-4 text-xl font-bold">付款失敗或已取消</h1>
      <p class="mt-2 text-gray-600">請重新嘗試付款或聯絡客服。</p>
      <a href="checkout.html" class="btn-primary mt-6 inline-block">重新付款</a>
    </div>
  </main>

  <footer class="border-t bg-gray-50 py-8">
    <div class="mx-auto max-w-7xl px-4 text-sm text-gray-500">
      <p>宏達補習班 · 臺南市中西區中正路88號7樓 · 電話：(06) 2201833</p>
    </div>
  </footer>
  <script>
    var status = new URLSearchParams(location.search).get('status');
    if (status === 'success') {
      document.getElementById('result-success').classList.remove('hidden');
    } else {
      document.getElementById('result-fail').classList.remove('hidden');
    }
  </script>
</body>
</html>

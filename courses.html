<!DOCTYPE html>

  <header class="sticky top-0 z-50 border-b bg-white">

      <a href="index.html" class="text-xl font-bold text-primary">宏達升學教育機構</a>
      <nav class="hidden md:flex items-center gap-6">
        <a href="login.html" class="text-gray-600 hover:text-primary">會員登入</a>
        <a href="about.html" class="text-gray-600 hover:text-primary">關於我們</a>
        <a href="courses.html" class="text-primary font-medium">課程列表</a>
        <a href="news.html" class="text-gray-600 hover:text-primary">最新消息</a>
        <a href="testimonials.html" class="text-gray-600 hover:text-primary">學員見證</a>
        <form action="search.html" method="get" class="inline-flex items-center">

          <button type="submit" class="rounded-r border border-l-0 border-gray-300 bg-gray-100 px-2 py-1.5 text-sm text-gray-600 hover:bg-gray-200">搜尋</button>

    <div class="mb-8">

        <a href="courses.html" class="rounded-full bg-primary px-4 py-2 text-sm text-white">全部</a>
        <a href="courses.html?cat=高中升學" class="rounded-full bg-gray-100 px-4 py-2 text-sm text-gray-600 hover:bg-gray-200">高中升學</a>
        <a href="courses.html?cat=分科測驗" class="rounded-full bg-gray-100 px-4 py-2 text-sm text-gray-600 hover:bg-gray-200">分科測驗</a>
        <a href="courses.html?cat=醫科" class="rounded-full bg-gray-100 px-4 py-2 text-sm text-gray-600 hover:bg-gray-200">醫科</a>
        <a href="courses.html?cat=國中" class="rounded-full bg-gray-100 px-4 py-2 text-sm text-gray-600 hover:bg-gray-200">國中</a>
      </div>
    </div>
    <div class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
      <div class="rounded-xl border bg-white shadow-sm overflow-hidden">
        <a href="course-detail.html?slug=gsat-all"><img src="https://images.unsplash.com/photo-1434030216411-0b793f4b4173?w=400&h=225&fit=crop" alt="學測全科班" class="h-48 w-full object-cover" /></a>

      </div>
      <div class="rounded-xl border bg-white shadow-sm overflow-hidden">
        <a href="course-detail.html?slug=ast-physics"><img src="https://images.unsplash.com/photo-1635070041078-e363dbe005cb?w=400&h=225&fit=crop" alt="指考物理專班" class="h-48 w-full object-cover" /></a>
        <div class="p-4"><span class="text-xs text-primary">分科測驗</span><a href="course-detail.html?slug=ast-physics"><h2 class="mt-1 font-semibold hover:text-primary">指考物理專班</h2></a><p class="mt-1 text-sm text-gray-500 line-clamp-2">分科測驗物理專攻，自然組升學首選。</p><p class="mt-3 text-lg font-bold text-primary">洽詢報名</p><a href="course-detail.html?slug=ast-physics" class="mt-2 inline-block rounded-lg border border-primary px-3 py-1.5 text-sm text-primary hover:bg-primary/5">課程詳情</a></div>

      <div class="rounded-xl border bg-white shadow-sm overflow-hidden">

        <div class="p-4"><span class="text-xs text-primary">醫科</span><a href="course-detail.html?slug=med-class"><h2 class="mt-1 font-semibold hover:text-primary">醫科班</h2></a><p class="mt-1 text-sm text-gray-500 line-clamp-2">目標醫科與頂大，宏達兩屆台大醫科狀元佳績。</p><p class="mt-3 text-lg font-bold text-primary">洽詢報名</p><a href="course-detail.html?slug=med-class" class="mt-2 inline-block rounded-lg border border-primary px-3 py-1.5 text-sm text-primary hover:bg-primary/5">課程詳情</a></div>
      </div>
      <div class="rounded-xl border bg-white shadow-sm overflow-hidden">
        <a href="course-detail.html?slug=junior-high"><img src="https://images.unsplash.com/photo-1523240795612-9a054b0db644?w=400&h=225&fit=crop" alt="國中會考班" class="h-48 w-full object-cover" /></a>
        <div class="p-4"><span class="text-xs text-primary">國中</span><a href="course-detail.html?slug=junior-high"><h2 class="mt-1 font-semibold hover:text-primary">國中會考班</h2></a><p class="mt-1 text-sm text-gray-500 line-clamp-2">國中會考完整輔導，銜接高中升學。</p><p class="mt-3 text-lg font-bold text-primary">洽詢報名</p><a href="course-detail.html?slug=junior-high" class="mt-2 inline-block rounded-lg border border-primary px-3 py-1.5 text-sm text-primary hover:bg-primary/5">課程詳情</a></div>

  <footer class="border-t bg-gray-50 py-8">
    <div class="mx-auto max-w-7xl px-4 text-sm text-gray-500">
      <p>宏達補習班 · 臺南市中西區中正路88號7樓 · 電話：(06) 2201833</p>
    </div>
  </footer>
  <script src="js/main.js"></script>

</html>

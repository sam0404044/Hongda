<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>註冊 | 宏達升學教育機構</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { colors: { primary: { DEFAULT: '#1a5f4a', light: '#2d8a6e' } } } } }</script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="min-h-screen flex flex-col">
  <header class="border-b bg-white">
    <div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-4">
      <a href="index.html" class="text-xl font-bold text-primary">宏達升學教育機構</a>
      <a href="login.html" class="btn-primary">會員登入</a>
    </div>
  </header>

  <main class="mx-auto max-w-md flex-1 px-4 py-12">
    <h1 class="section-title mb-6">註冊新帳號</h1>
    <form action="login.html" method="get" class="space-y-4 rounded-xl border bg-white p-6">
      <div>
        <label class="block text-sm font-medium text-gray-700">姓名</label>
        <input type="text" name="name" required class="mt-1 w-full rounded-lg border px-3 py-2" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">電子郵件</label>
        <input type="email" name="email" required class="mt-1 w-full rounded-lg border px-3 py-2" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">密碼</label>
        <input type="password" name="password" required class="mt-1 w-full rounded-lg border px-3 py-2" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">生日</label>
        <input type="date" name="birthday" class="mt-1 w-full rounded-lg border px-3 py-2" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">電話</label>
        <input type="tel" name="phone" class="mt-1 w-full rounded-lg border px-3 py-2" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">性別</label>
        <select name="gender" class="mt-1 w-full rounded-lg border px-3 py-2">
          <option value="">請選擇</option>
          <option value="M">男</option>
          <option value="F">女</option>
        </select>
      </div>
      <button type="submit" class="btn-primary w-full">註冊</button>
      <p class="text-center text-sm text-gray-600">已有帳號？<a href="login.html" class="text-primary hover:underline">登入</a></p>
    </form>
  </main>

  <footer class="border-t bg-gray-50 py-8">
    <div class="mx-auto max-w-7xl px-4 text-sm text-gray-500">
      <p>宏達補習班 · 臺南市中西區中正路88號7樓 · 電話：(06) 2201833</p>
    </div>
  </footer>
  <script src="js/main.js"></script>
</body>
</html>

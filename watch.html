<!DOCTYPE html>
<html lang="zh-TW">
<head>

  <title>課程播放 | 宏達升學教育機構</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { colors: { primary: { DEFAULT: '#1a5f4a', light: '#2d8a6e' } } } } }</script>
  <link rel="stylesheet" href="css/style.css" />

<body class="min-h-screen flex flex-col bg-gray-900 text-white">
  <header class="flex items-center gap-4 border-b border-gray-700 px-4 py-3">

        <p class="text-xs text-gray-400">購買與播放截止日：依訂單為準</p>
        <ul class="mt-4 space-y-2">
          <li><a href="watch.html?slug=gsat-all" class="flex items-center gap-2 rounded-lg bg-primary/20 p-2 text-white"><span>○</span><span class="flex-1 truncate">國文</span><span class="text-xs text-gray-500">—</span></a><div class="ml-6 text-xs text-gray-500">課後測驗 · <a href="quiz.html" class="text-primary hover:underline">查看分數</a> | 教材下載 <a href="#" class="text-primary hover:underline">Google 雲端</a></div></li>
          <li><a href="#" class="flex items-center gap-2 rounded-lg p-2 text-gray-300 hover:bg-gray-800"><span>○</span><span class="flex-1 truncate">英文</span><span class="text-xs text-gray-500">—</span></a></li>
          <li><a href="#" class="flex items-center gap-2 rounded-lg p-2 text-gray-300 hover:bg-gray-800"><span>○</span><span class="flex-1 truncate">數學</span><span class="text-xs text-gray-500">—</span></a></li>
        </ul>
      </div>

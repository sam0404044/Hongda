<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>學員見證 | 宏達升學教育機構</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { colors: { primary: { DEFAULT: '#1a5f4a', light: '#2d8a6e' } } } } }</script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="min-h-screen flex flex-col">
  <header class="sticky top-0 z-50 border-b bg-white">
    <div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-4">
      <a href="index.html" class="text-xl font-bold text-primary">宏達升學教育機構</a>
      <nav class="hidden md:flex items-center gap-6">
        <a href="login.html" class="text-gray-600 hover:text-primary">會員登入</a>
        <a href="about.html" class="text-gray-600 hover:text-primary">關於我們</a>
        <a href="courses.html" class="text-gray-600 hover:text-primary">課程列表</a>
        <a href="news.html" class="text-gray-600 hover:text-primary">最新消息</a>
        <a href="testimonials.html" class="text-primary font-medium">學員見證</a>
        <form action="search.html" method="get" class="inline-flex items-center">
          <input type="search" name="q" placeholder="搜尋課程、文章…" class="rounded-l border border-gray-300 px-2 py-1.5 text-sm w-36 focus:outline-none focus:border-primary" />
          <button type="submit" class="rounded-r border border-l-0 border-gray-300 bg-gray-100 px-2 py-1.5 text-sm text-gray-600 hover:bg-gray-200">搜尋</button>
        </form>
        <a href="cart.html" class="text-gray-600 hover:text-primary">購物車</a>
        <a href="login.html" class="btn-primary">會員登入</a>
      </nav>
    </div>
  </header>

  <main class="mx-auto max-w-7xl flex-1 px-4 py-8">
    <h1 class="section-title mb-6">學員見證</h1>
    <div class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
      <div class="rounded-xl border bg-white p-6 shadow-sm">
        <p class="text-gray-600">「宏達老師帶得很扎實，講義與進度安排清楚，最後如願考上理想校系，感謝宏達！」</p>
        <p class="mt-4 font-medium">王同學</p>
        <p class="text-sm text-gray-500">學測 · 錄取國立大學</p>
        <a href="courses.html" class="mt-2 inline-block text-sm text-primary hover:underline">推薦課程：學測全科班</a>
      </div>
      <div class="rounded-xl border bg-white p-6 shadow-sm">
        <p class="text-gray-600">「在宏達從國中補到高中，誠懇踏實的教學讓我建立好基礎，成績穩定進步。」</p>
        <p class="mt-4 font-medium">陳同學</p>
        <p class="text-sm text-gray-500">大台南地區 · 高中升學</p>
        <a href="courses.html" class="mt-2 inline-block text-sm text-primary hover:underline">推薦課程：學測全科班</a>
      </div>
      <div class="rounded-xl border bg-white p-6 shadow-sm">
        <p class="text-gray-600">「班訓『含淚播種、歡笑收割』真的體會到了，負責的師資與環境是選擇宏達的原因。」</p>
        <p class="mt-4 font-medium">林同學</p>
        <p class="text-sm text-gray-500">醫科班 · 升學見證</p>
        <a href="courses.html" class="mt-2 inline-block text-sm text-primary hover:underline">推薦課程：醫科班</a>
      </div>
    </div>
  </main>

  <footer class="border-t bg-gray-50 py-8">
    <div class="mx-auto max-w-7xl px-4 text-sm text-gray-500">
      <p>宏達補習班 · 臺南市中西區中正路88號7樓 · 電話：(06) 2201833</p>
    </div>
  </footer>
  <script src="js/main.js"></script>
</body>
</html>

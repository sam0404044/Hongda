<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>結帳 | 宏達升學教育機構</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { colors: { primary: { DEFAULT: '#1a5f4a', light: '#2d8a6e' } } } } }</script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="min-h-screen flex flex-col">
  <header class="sticky top-0 z-50 border-b bg-white">
    <div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-4">
      <a href="index.html" class="text-xl font-bold text-primary">宏達升學教育機構</a>
      <nav class="hidden md:flex items-center gap-6">
        <a href="cart.html" class="text-gray-600 hover:text-primary">購物車</a>
        <a href="login.html" class="btn-primary">會員登入</a>
      </nav>
    </div>
  </header>

  <main class="mx-auto max-w-2xl flex-1 px-4 py-8">
    <h1 class="section-title mb-6">結帳</h1>
    <p class="text-gray-600">登入檢查：未登入請先 <a href="login.html" class="text-primary underline">登入</a>。</p>
    <form action="checkout-result.html" method="get" class="mt-6 space-y-6 rounded-xl border bg-white p-6">
      <div>
        <h2 class="font-medium">選擇付款方式</h2>
        <div class="mt-2 space-y-2">
          <label class="flex items-center gap-2"><input type="radio" name="status" value="success" checked /> 信用卡（模擬成功）</label>
          <label class="flex items-center gap-2"><input type="radio" name="status" value="fail" /> 模擬失敗</label>
        </div>
      </div>
      <div class="flex gap-4">
        <button type="submit" class="btn-primary flex-1">確認付款</button>
        <a href="cart.html" class="btn-outline flex-1 text-center">返回購物車</a>
      </div>
    </form>
  </main>

  <footer class="border-t bg-gray-50 py-8">
    <div class="mx-auto max-w-7xl px-4 text-sm text-gray-500">
      <p>宏達補習班 · 臺南市中西區中正路88號7樓 · 電話：(06) 2201833</p>
    </div>
  </footer>
  <script src="js/main.js"></script>
</body>
</html>

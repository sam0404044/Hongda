<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>會員中心 | 宏達升學教育機構</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { colors: { primary: { DEFAULT: '#1a5f4a', light: '#2d8a6e' } } } } }</script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="min-h-screen flex flex-col">
  <header class="sticky top-0 z-50 border-b bg-white">
    <div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-4">
      <a href="index.html" class="text-xl font-bold text-primary">宏達升學教育機構</a>
      <nav class="hidden md:flex items-center gap-6">
        <a href="account-courses.html" class="text-gray-600 hover:text-primary">我的課程</a>
        <a href="account.html" class="text-primary font-medium">會員中心</a>
        <a href="account-orders.html" class="text-gray-600 hover:text-primary">購買紀錄</a>
        <a href="account-coins.html" class="text-gray-600 hover:text-primary">神話幣</a>
        <a href="account-scores.html" class="text-gray-600 hover:text-primary">測驗成績</a>
        <a href="courses.html?trial=1" class="text-gray-600 hover:text-primary">免費體驗</a>
        <a href="index.html" class="btn-outline">會員登出</a>
      </nav>
    </div>
  </header>

  <main class="mx-auto max-w-7xl flex-1 px-4 py-8">
    <div class="flex flex-col gap-8 lg:flex-row">
      <aside class="w-full lg:w-56 flex-shrink-0">
        <nav class="rounded-xl border bg-white p-4">
          <h2 class="mb-4 font-medium text-primary">會員中心</h2>
          <ul class="space-y-1">
            <li><a href="account.html" class="block rounded px-3 py-2 bg-primary/10 text-primary">會員資料</a></li>
            <li><a href="account-courses.html" class="block rounded px-3 py-2 text-gray-700 hover:bg-primary/10 hover:text-primary">我的課程</a></li>
            <li><a href="account-settings.html" class="block rounded px-3 py-2 text-gray-700 hover:bg-primary/10 hover:text-primary">帳號設定</a></li>
            <li><a href="account-orders.html" class="block rounded px-3 py-2 text-gray-700 hover:bg-primary/10 hover:text-primary">購買紀錄</a></li>
            <li><a href="account-coins.html" class="block rounded px-3 py-2 text-gray-700 hover:bg-primary/10 hover:text-primary">宏達幣</a></li>
            <li><a href="account-scores.html" class="block rounded px-3 py-2 text-gray-700 hover:bg-primary/10 hover:text-primary">測驗成績</a></li>
          </ul>
        </nav>
      </aside>
      <div class="min-w-0 flex-1">
        <div class="rounded-xl border bg-white p-6">
          <h1 class="section-title mb-6">會員資料</h1>
          <dl class="grid gap-4 sm:grid-cols-2">
            <div><dt class="text-sm text-gray-500">姓名</dt><dd class="font-medium">—</dd></div>
            <div><dt class="text-sm text-gray-500">電子郵件</dt><dd class="font-medium">—</dd></div>
            <div><dt class="text-sm text-gray-500">訂閱狀態 / 到期日</dt><dd class="font-medium">—</dd></div>
          </dl>
          <p class="mt-4 text-sm text-gray-500">登入後由後端 API 帶入實際資料。</p>
        </div>
      </div>
    </div>
  </main>

  <footer class="border-t bg-gray-50 py-8">
    <div class="mx-auto max-w-7xl px-4 text-sm text-gray-500">
      <p>宏達補習班 · 臺南市中西區中正路88號7樓 · 電話：(06) 2201833</p>
    </div>
  </footer>
  <script src="js/main.js"></script>
</body>
</html>

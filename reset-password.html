<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>重設密碼 | 宏達升學教育機構</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { colors: { primary: { DEFAULT: '#1a5f4a', light: '#2d8a6e' } } } } }</script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="min-h-screen flex flex-col">
  <header class="border-b bg-white">
    <div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-4">
      <a href="index.html" class="text-xl font-bold text-primary">宏達升學教育機構</a>
      <a href="login.html" class="btn-primary">會員登入</a>
    </div>
  </header>

  <main class="mx-auto max-w-md flex-1 px-4 py-12">
    <h1 class="section-title mb-6">重設密碼</h1>
    <p class="text-gray-600">由 Email 連結進入，請設定新密碼。</p>
    <form action="login.html" method="get" class="mt-4 space-y-4 rounded-xl border bg-white p-6">
      <div>
        <label class="block text-sm font-medium text-gray-700">新密碼</label>
        <input type="password" name="password" required class="mt-1 w-full rounded-lg border px-3 py-2" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">確認密碼</label>
        <input type="password" name="confirm" required class="mt-1 w-full rounded-lg border px-3 py-2" />
      </div>
      <button type="submit" class="btn-primary w-full">設定新密碼</button>
      <a href="login.html" class="mt-4 block text-center text-sm text-primary hover:underline">返回登入</a>
    </form>
  </main>

  <footer class="border-t bg-gray-50 py-8">
    <div class="mx-auto max-w-7xl px-4 text-sm text-gray-500">
      <p>宏達補習班 · 臺南市中西區中正路88號7樓 · 電話：(06) 2201833</p>
    </div>
  </footer>
  <script src="js/main.js"></script>
</body>
</html>

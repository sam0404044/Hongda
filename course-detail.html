<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>課程詳情 | 宏達升學教育機構</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { colors: { primary: { DEFAULT: '#1a5f4a', light: '#2d8a6e' } } } } }</script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="min-h-screen flex flex-col">
  <header class="sticky top-0 z-50 border-b bg-white">
    <div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-4">
      <a href="index.html" class="text-xl font-bold text-primary">宏達升學教育機構</a>
      <nav class="hidden md:flex items-center gap-6">
        <a href="login.html" class="text-gray-600 hover:text-primary">會員登入</a>
        <a href="courses.html" class="text-primary font-medium">課程列表</a>
        <a href="cart.html" class="text-gray-600 hover:text-primary">購物車</a>
        <a href="login.html" class="btn-primary">會員登入</a>
      </nav>
    </div>
  </header>

  <main class="mx-auto max-w-7xl flex-1 px-4 py-8">
    <div class="grid gap-8 lg:grid-cols-3">
      <div class="lg:col-span-2">
        <div class="rounded-xl border bg-white overflow-hidden">
          <div class="aspect-video bg-gray-900">
            <img src="https://images.unsplash.com/photo-1434030216411-0b793f4b4173?w=800&h=450&fit=crop" alt="課程封面" class="h-full w-full object-contain" />
          </div>
          <div class="flex gap-2 overflow-x-auto p-2">
            <div class="min-w-[120px] rounded border bg-gray-50 p-2 text-center text-sm">國文</div>
            <div class="min-w-[120px] rounded border bg-gray-50 p-2 text-center text-sm">英文</div>
            <div class="min-w-[120px] rounded border bg-gray-50 p-2 text-center text-sm">數學</div>
            <div class="min-w-[120px] rounded border bg-gray-50 p-2 text-center text-sm">自然</div>
            <div class="min-w-[120px] rounded border bg-gray-50 p-2 text-center text-sm">社會</div>
          </div>
        </div>
      </div>
      <div>
        <h1 class="text-2xl font-bold">學測全科班</h1>
        <p class="mt-2 text-primary">高中升學</p>
        <div class="mt-4 flex items-baseline gap-2">
          <span class="text-2xl font-bold text-primary">洽詢報名</span>
        </div>
        <div class="mt-4 rounded-lg border bg-gray-50 p-4">
          <p class="text-sm font-medium">開課班別與優惠</p>
          <p class="mt-1 text-sm text-gray-600">歡迎來電或至各分校洽詢班別、費用及開課時間。</p>
        </div>
        <div class="mt-4 flex flex-col gap-2">
          <a href="watch.html?slug=gsat-all" class="flex items-center justify-center gap-2 rounded-lg border-2 border-primary py-3 text-primary hover:bg-primary/5">試聽課程</a>
          <a href="tel:06-2201833" class="flex items-center justify-center gap-2 rounded-lg bg-primary py-3 text-white hover:bg-primary-light">來電洽詢報名</a>
        </div>
      </div>
    </div>
    <div class="mt-10 border-t pt-8">
      <div class="flex flex-wrap gap-2 border-b">
        <button type="button" class="border-b-2 border-primary px-4 py-2 text-primary">課程介紹</button>
        <button type="button" class="border-b-2 border-transparent px-4 py-2 text-gray-600">課程章節大綱</button>
        <button type="button" class="border-b-2 border-transparent px-4 py-2 text-gray-600">學員回饋</button>
      </div>
      <div class="mt-4 prose max-w-none">
        <p>宏達升學教育機構學測全科班，針對大學學測完整規劃，誠懇踏實的教學與年年領先的升學佳績，深得大台南地區家長信賴。</p>
        <h3 class="mt-6">課程大綱</h3>
        <ul><li>國文</li><li>英文</li><li>數學</li><li>自然（物理、化學、生物、地科）</li><li>社會（歷史、地理、公民）</li></ul>
      </div>
    </div>
    <div class="fixed bottom-0 left-0 right-0 flex items-center justify-between border-t bg-white p-4 lg:hidden">
      <span class="text-lg font-bold text-primary">洽詢報名</span>
      <a href="tel:06-2201833" class="btn-primary">來電洽詢</a>
    </div>
    <div class="h-20 lg:hidden"></div>
  </main>

  <footer class="border-t bg-gray-50 py-8">
    <div class="mx-auto max-w-7xl px-4 text-sm text-gray-500">
      <p>宏達補習班 · 臺南市中西區中正路88號7樓 · 電話：(06) 2201833</p>
    </div>
  </footer>
  <script src="js/main.js"></script>
</body>
</html>
